# CR-AM-ORG-RES-000 repository-standard declaration.
#
# Declares this repository's adoption of the Assessment-Models maturity-model
# repository standard (AM-MODEL-REPOSITORY-STANDARD v1.0.0) at conformance
# level `registered`, as the second, materially different implementation for
# AC-28 (composite model).
#
# model.yaml remains the authoritative identity manifest (CR-AM-11 §15
# contract handshake); this declaration restates model identity for
# cross-checking only. Level is `registered` (not `structural`) because the
# composite model definition lives in maturity/evaluation.yaml +
# maturity/components/ instead of maturity/model/ — an established structure
# that is mapped, never restructured (migration matrix M2; structure-mappings
# amendment: maturity-model-standard#3).
repository:
  type: maturity-model
standard:
  id: AM-MODEL-REPOSITORY-STANDARD
  version: "1.0.0"
  conformance: registered
model:
  id: maturity-model-digital-transformation
  name: Digital Transformation Maturity Model
  version: "1.0.0"
