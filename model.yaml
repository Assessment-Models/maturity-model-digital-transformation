# CR-AM-11 §15 contract handshake — Digital Transformation first-model candidate.
#
# The contract family (`maturity-scale-contract`) and the canonical source
# (`technehub-labs/dea-metamodel`) are resolved by the reusable Level 2
# workflow `Assessment-Models/assessment-ci/.github/workflows/contract-conformance.yml`
# against the published suite at the pinned release.
#
# `version: "1.0"` is a prefix of the published `1.0.0` — acceptable per
# the resolver's prefix-compatibility rule.
#
# Component references point at the component packages published in
# Assessment-Models/maturity-components (CR-AM-11 sections 18-20); the
# upstream canonical component registry remains
# technehub-labs/dea-metamodel assessment-models/maturity/components/registry.yaml (CR-AM-10).
id: maturity-model-digital-transformation
type: maturity-model
name: Digital Transformation Maturity Model
description: >-
  Composite maturity model spanning operations, technology, and
  services-delivery child models, plus the org's own adoption of
  OpenDEA itself. First independent model in the Assessment-Models
  ecosystem (CR-AM-11 §31 first-model candidate). Since 1.1.0-alpha this
  repository also hosts the additive 'operationalized' model line
  (maturity/operationalized/) — see README 'Model lines' and mappings/.
version: 1.1.0-alpha
conformance:
  contract:
    id: maturity-scale-contract
  source:
    organization: technehub-labs
    repository: dea-metamodel
  version: "1.0"
compatibility:
  metamodel:
    minimum: 1.0.0
    maximum: "<2.0.0"
  contracts:
    - id: maturity-scale-contract
      version: "^1.0"
    - id: maturity-model-contract
      version: "^1.0"
    - id: conformance-contract
      version: "^1.0"
components:
  - id: digital-culture
    type: dimension
    kind: import
    source:
      repository: Assessment-Models/maturity-components
    version: 1.0.0
    reference: v1.0.0
  - id: technology-adoption
    type: dimension
    kind: import
    source:
      repository: Assessment-Models/maturity-components
    version: 1.0.0
    reference: v1.0.0
  - id: operations-modernization
    type: dimension
    kind: extend
    source:
      repository: Assessment-Models/maturity-components
    version: 1.0.0
    reference: v1.0.0
  - id: services-delivery
    type: dimension
    kind: override
    source:
      repository: Assessment-Models/maturity-components
    version: 1.0.0
    reference: v1.0.0
dependencies:
  - id: dea-evaluation-opendea-enterprise-architecture-v1
    reference: v1.0.0