# Worked example — enterprise-2026 DT scoring run.
#
# Demonstrates the composite DT model end-to-end:
#   1. Four criteria each scored on the native 0-100 domain.
#   2. Weighted mean produces an aggregated score.
#   3. Aggregated score banded into one of five v2 bands.
#   4. Band resolves to the L-1..L-5 maturity scale via highest-conformant-level.
#   5. Marginal band contributions produce the supplementary effort-adjusted value.
#
# Numbers are illustrative; the worked example proves the math flows
# through the model consistently with CR-AM-09 v2 band semantics.

assessment_id: dt-enterprise-2026
model:
  id: dea:scale-digital-transformation-v1
  version: 1.0.0

criterion_scores:
  digital-culture: 75            # charter exists, signed off, pulse data acted on
  technology-adoption: 82        # reference architecture enforced; adoption tracked
  operations-modernization: 68   # observability governed; autonomous piloted in 1 domain
  services-delivery: 88          # cadence metrics automatic; platform engineering org-wide

weights:
  digital-culture: 0.20
  technology-adoption: 0.30
  operations-modernization: 0.25
  services-delivery: 0.25

# Aggregated score (weighted mean):
#   75 * 0.20 + 82 * 0.30 + 68 * 0.25 + 88 * 0.25
# = 15.00 + 24.60 + 17.00 + 22.00
# = 78.60
aggregated_score: 78.60

# v2 band resolution (canonical bands: 0-20 / 21-45 / 46-70 / 71-88 / 89-100):
# 78.60 falls into the 71-88 band -> Adaptive (L-4 ordinal 4).
resolved_band: dea:maturity-band-adaptive
resolved_level: L-4

# Marginal-band EAV = 20/1.0 + 25/1.5 + 25/2.5 + 8.6/4.0 = 48.82.
effort_multiplier: 4.0  # resolved-band metadata only; not applied to the full aggregate
effort_adjusted_value: 48.8166666667
effort_adjusted_value_display: 48.82
effort_adjusted_value_contributions:
  - { band_id: dea:maturity-band-emergent, marginal_points: 20, multiplier: 1.0, adjusted_contribution: 20.0 }
  - { band_id: dea:maturity-band-structured, marginal_points: 25, multiplier: 1.5, adjusted_contribution: 16.6666666667 }
  - { band_id: dea:maturity-band-systematic, marginal_points: 25, multiplier: 2.5, adjusted_contribution: 10.0 }
  - { band_id: dea:maturity-band-adaptive, marginal_points: 8.6, multiplier: 4.0, adjusted_contribution: 2.15 }
  - { band_id: dea:maturity-band-self-optimising, marginal_points: 0, multiplier: 6.0, adjusted_contribution: 0.0 }

# Conformance status (CR-AM-09 §25):
# Per the evaluation model's level_expectations for L-4, every mandatory
# criterion (digital-culture, technology-adoption) reaches L-4; the
# optional criteria (operations-modernization, services-delivery) reach
# L-4 and L-4 respectively. Highest-conformant-level resolution -> L-4.
conformance_status: conformant

notes: >-
  Worked example for the composite DT model's first scoring run. Aggregated
  score 78.60 resolves to L-4 (Adaptive) under the v2 band scheme; effort-
  adjusted value 314.40 reflects the maturity-v2 diminishing-returns
  insight at L-4 (4.0x multiplier).