# Operationalized evaluation - weighted 0-100 over 6 dimension criteria

id: dea:evaluation-digital-transformation-operationalized-v1
version: 1.0.0-alpha
metamodel_version: 1.0.0
name: Digital Transformation Operationalized Evaluation Model
description: Weighted 0-100 over the six dimension criteria (0.20/0.20/0.20/0.15/0.10/0.15); criterion 1-5 -> 0-100; banded
  via v2 bands; resolved to L-0..L-4 by highest-conformant-level with the mandatory-dimension gate (d1-d4).
status: alpha
scale:
  id: dea:scale-digital-transformation-operationalized-v1
  version: 1.0.0-alpha
criteria_register: maturity/operationalized/model/
scoring:
  mechanism: weighted
  domain:
    kind: numeric-0-100
    minimum: 0
    maximum: 100
  aggregation_rule: overall = sum(dim_score * weight); dim = mean(subdims); subdim = mean(criteria 0-100).
criteria:
- id: d1
  name: Customer & Ecosystem Value
  weight: 0.2
  description: How the digital business understands, serves, and grows with customers and the ecosystems it cultivates -
    journeys, personalization, partnerships, and monetization.
  mandatory: true
  evidence_requirements:
  - Per-criterion evidence artifacts from maturity/operationalized/model/.
  level_expectations:
  - level: L-0
    expectation: 'Unrealized: Value unrealized: digital activity is informal and person-dependent; transformation value
      is at risk'
  - level: L-1
    expectation: 'Proven: Value proven in governed pilots: strategy and playbooks documented, adoption still uneven'
  - level: L-2
    expectation: 'Standardized: Value standardized: digital practice is governed and tooling-enforced org-wide, so value
      is repeatable'
  - level: L-3
    expectation: 'Compounding: Value compounding: the digital business is metrics-driven, predictive and self-adapting,
      so value scales'
  - level: L-4
    expectation: 'Leading: Value leading: the digital business is self-optimizing and intent-driven end to end, setting
      benchmarks'
- id: d2
