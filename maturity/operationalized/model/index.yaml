# Operationalized criteria register — index (per-dimension files alongside)

id: dea:model-digital-transformation-operationalized-v1
version: 1.0.0-alpha
name: Digital Transformation Operationalized — criteria register
description: 'MECE register: 6 dimensions -> 23 sub-dimensions -> 70 criteria. Each criterion has one home, 12 transversal
  levers as tags (not dimensions), 5 evidence-anchored progression levels (model levels 1-5 = canonical L-0..L-4 per scale.yaml
  correlation), and observable evidence. Lite rapid path: lite_question per sub-dimension (5-point Likert). Local home:
  maturity-model-digital-transformation/maturity/operationalized/model/. Catalog twin: dea:maturity-digital-transformation-operationalized
  (dea-catalog-maturity-models, PRs #6/#10/#12).'
transversal_levers:
- id: agentic-ai
  name: Agentic AI & Agents
  description: Autonomous/semi-autonomous software entities that perceive, decide, act and achieve goals with minimal human
    supervision; multi-agent systems orchestrated toward strategic objectives. Agency is graded (levels of agency) and governed
    (Gartner Top Strategic Technology Trends 2025).
- id: autonomy
  name: Autonomy Ladder
  description: 'TM Forum Autonomous Networks L0-L5: per domain, who owns awareness, analysis, decision, execution, and intent.
    L4 = system owns awareness-to-execution with intent shared; L5 = system sets its own intents.'
- id: digital-twins
  name: Digital Twins & Simulation
  description: Dynamic software models on operational/contextual data that understand, simulate and respond - from network/service
    twins to the Digital Twin of an Organization (DTO) used to prioritize, plan, monitor, simulate and scale initiatives
    (Gartner).
- id: human-agent-teaming
  name: Human-Agent Teaming
  description: People and AI agents collaborating/coordinating toward shared goals as teammates, with trust calibration,
    delegation protocols, adaptive autonomy, and human oversight (human-in/on-the-loop) (HMT/HAIT literature).
- id: ecosystem-platforms
  name: Ecosystems, Platforms & Network APIs
  description: Platform and ecosystem business models incl. GSMA Open Gateway / CAMARA network APIs (number verification,
    SIM swap, location, quality-on-demand, edge discovery, carrier billing), NaaS, slicing, B2B2X marketplaces.
- id: trust-security-privacy
  name: Security, Privacy, Trust & AI TRiSM
  description: 'Zero trust, supply-chain security, privacy/PETs, sovereignty, and AI TRiSM (AI trust, risk and security
    management): continuous monitoring, explainability, bias/fairness, guardrails, guardian agents, EU AI Act readiness
    (Gartner).'
- id: sustainability-esg
  name: Sustainability & ESG
  description: ESG strategy and reporting (CSRD/double materiality), carbon accounting (Scopes 1-3), GreenOps, circular
    IT and e-waste.
- id: composability
  name: Composability & Open APIs
  description: Composable, API-first, event-driven architecture aligned to open standards (e.g., TM Forum ODA) with governed
    API catalogs and golden paths.
- id: business-value
  name: Business Value & Monetization
  description: 'Customer/ecosystem-centric value: digital business models, pricing and charging, revenue assurance, unit
    economics, measurable outcomes.'
- id: innovation
  name: Innovation & Experimentation
  description: Experimentation culture, safe-to-fail, flow metrics, venturing, open-source and standards participation.
- id: grc
  name: Governance, Risk & Compliance
  description: ERM, internal audit, regtech, DORA/NIS2 resilience testing, third-party/vendor risk, concentration and exit.
- id: data-intelligence
  name: Data & Decision Intelligence
  description: Data products, quality, lineage, governance, sharing, AI data readiness, twins data, insights-to-action loops.
